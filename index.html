<!doctype html>
<html lang="uk" style="background:#0a0d13">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <meta name="theme-color" content="#141416" />
    <meta name="color-scheme" content="dark" />
    <!-- Застосунок на головному екрані iPhone: темний статус-бар поверх сторінки, без білих смуг -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MatchIQ" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>MatchIQ Admin</title>
    <style>
      /* Заставка під час запуску: те саме лого, що в шапці; стовпчики «ростуть» по черзі */
      .mq-splash { position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: #0a0d13; font-family: Inter, system-ui, -apple-system, sans-serif; }
      .mq-splash-mark { position: relative; display: grid; place-items: center; width: 76px; height: 76px; border-radius: 22px; background: #00b24b; box-shadow: 0 14px 40px rgba(0, 178, 75, .35); animation: mq-pop .6s cubic-bezier(.2, .9, .25, 1.4) both; }
      .mq-splash-mark::after { content: ""; position: absolute; inset: -8px; border-radius: 28px; border: 2px solid rgba(0, 178, 75, .45); animation: mq-halo 1.8s ease-out .4s infinite; }
      .mq-splash-mark svg { width: 46px; height: 46px; overflow: visible; }
      .mq-b { transform-box: fill-box; transform-origin: 50% 100%; animation: mq-bar 1.2s ease-in-out infinite; }
      .mq-b2 { animation-delay: .15s; } .mq-b3 { animation-delay: .3s; }
      .mq-splash-name { color: #f4f6fa; font-size: 20px; font-weight: 700; letter-spacing: -.02em; animation: mq-in .5s ease-out .2s both; }
      .mq-splash-name span { margin-left: 6px; padding: 3px 9px; border-radius: 999px; background: #1f2a44; color: #a3c0ff; font-size: 12px; font-weight: 600; vertical-align: 3px; }
      @keyframes mq-bar { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(.35); } }
      @keyframes mq-pop { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: none; } }
      @keyframes mq-halo { from { opacity: .9; transform: scale(.92); } to { opacity: 0; transform: scale(1.35); } }
      @keyframes mq-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
      .mq-splash.is-out { opacity: 0; transition: opacity .35s ease; pointer-events: none; }
      @media (prefers-reduced-motion: reduce) { .mq-splash, .mq-splash *, .mq-splash-mark::after { animation: none !important; } }
    </style>
  </head>
  <body class="bg-canvas text-ink antialiased">
    <div id="root"></div>
    <div id="mq-splash" class="mq-splash" role="status" aria-label="MatchIQ завантажується"><div class="mq-splash-mark"><svg viewBox="0 0 32 32" aria-hidden="true"><g transform="translate(5,6)" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v16"/><path d="M3 8h16" class="mq-ax"/><path class="mq-b mq-b1" d="M8 19v-4"/><path class="mq-b mq-b2" d="M14 19V7"/><path class="mq-b mq-b3" d="M20 19v-8"/></g></svg></div><div class="mq-splash-name">MatchIQ <span>Admin</span></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
